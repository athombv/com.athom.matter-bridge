<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <title>Matter Bridge Settings</title>
  <script
    type="text/javascript"
    src="/homey.js"
    data-origin="settings"
  ></script>
  <script
    type="text/javascript"
    src="./qrcode.min.js"
  ></script>
  <style type="text/css">
    #content {
      .zones {
        margin-top: var(--homey-su-4);

        >.zone {
          >.zone-name {
            font-size: 24px;
            font-weight: 600;
            color: var(--homey-color-mono-100);
          }

          >.zone-devices {
            display: grid;
            width: 100%;
            grid-template-columns: repeat(auto-fill, minmax(108px, 1fr));
            grid-gap: 12px;
            margin: var(--homey-su-2) 0 var(--homey-su-4);

            @media screen and (max-width: 380px) {
              grid-template-columns: repeat(auto-fill, minmax(96px, 1fr));
            }
          }
        }
      }

      /* Device tile */
      .device {
        display: block;
        -webkit-user-select: none !important;
        user-select: none !important;
        -webkit-tap-highlight-color: transparent;
        -webkit-user-drag: none;
        max-width: 140px;
      }

      .device__input {
        display: none;
      }

      .device__tile {
        --device-tile-padding: 7.4%;

        position: relative;
        display: block;
        cursor: pointer;
        padding-bottom: calc(100% - 4px);
        border-radius: var(--homey-border-radius);
        background: var(--homey-color-component);
        box-shadow: var(--homey-box-shadow);
        border: 2px solid transparent;
        transition: 200ms ease-in-out;
        transition-property: transform, border-color, background-color;
        will-change:
          transform, border-color, background-color;
        /* prevent transition flickering on sibling device tiles on safari for iPad and iPhone */
      }

      .device__tile:active {
        transform: scale(0.95);
      }

      .device__input:checked+.device__tile {
        border-color: var(--homey-color-blue);
        background: var(--homey-color-blue-o-05);
        box-shadow: var(--homey-box-shadow-selected);
      }

      .device__name-scale-wrapper {
        position: absolute;
        top: var(--device-tile-padding);
        right: var(--device-tile-padding);
        bottom: var(--device-tile-padding);
        left: var(--device-tile-padding);
        width: calc(100% - var(--device-tile-padding) * 2);
        height: calc(100% - var(--device-tile-padding) * 2);
      }

      .device__name-position-wrapper {
        display: flex;
        justify-items: flex-end;
        width: 92px;
        height: 92px;
      }

      .device__name {
        margin-top: auto;
        line-height: 1.13;
        display: -webkit-box;
        -webkit-line-clamp: 3;
        -webkit-box-orient: vertical;
        overflow: hidden;
        text-overflow: ellipsis;
        left: 0;
        bottom: 0;
        right: 0;
        font-size: 15px;
        -webkit-user-select: none !important;
        user-select: none !important;
        word-break: break-word;
        hyphens: auto;
      }

      .device__icon {
        position: absolute;
        display: block;
        top: var(--device-tile-padding);
        left: var(--device-tile-padding);
        flex-shrink: 0;
        width: 33%;
        padding-bottom: 33%;
        background-color: var(--homey-color-mono-80);
        mask-size: contain;

        &.is-missing {
          background-color: transparent;
          border: 3px dashed var(--homey-color-mono-70);
          border-radius: var(--homey-border-radius);
        }
      }

      .device__checked {
        opacity: 0;
        position: absolute;
        right: var(--device-tile-padding);
        top: var(--device-tile-padding);
        display: block;
        width: 18.5%;
        height: 18.5%;
        background: var(--homey-color-blue);
        -webkit-mask-size: 100%;
        mask-size: 100%;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        transition: opacity var(--homey-duration-fast) var(--homey-curve-fast-in);
      }

      .device__input[type='checkbox']+.device__tile .device__checked {
        -webkit-mask-image: url('/icons/checkmark-square-fill.svg');
        mask-image: url('/icons/checkmark-square-fill.svg');
      }

      .device__input[type='radio']+.device__tile .device__checked {
        -webkit-mask-image: url('/icons/checkmark-circle-fill.svg');
        mask-image: url('/icons/checkmark-circle-fill.svg');
      }

      .device__input:checked+.device__tile .device__checked {
        opacity: 1;
      }
    }

  </style>
  <link rel="stylesheet" href="./settings.css">
</head>

<body>
  <div id="content" class="settings-page">
    <div class="settings-tabs" role="tablist" aria-label="Matter Bridge settings">
      <button id="devices-tab" class="settings-tab hy-nostyle" type="button" role="tab"
        aria-controls="devices-panel" aria-selected="false" tabindex="-1" disabled>Devices</button>
      <button id="pairing-tab" class="settings-tab hy-nostyle" type="button" role="tab"
        aria-controls="pairing-panel" aria-selected="true">Pairing</button>
    </div>
    <section id="devices-panel" role="tabpanel" aria-labelledby="devices-tab" hidden>
      <div class="settings-heading">
        <h1>Devices to share</h1>
        <span id="selected-count" class="selected-count" aria-live="polite"></span>
      </div>
      <p class="settings-description">All connected platforms share these devices.</p>
      <div id="devices-content"></div>
    </section>
    <section id="pairing-panel" role="tabpanel" aria-labelledby="pairing-tab">
      <div id="pairing-content"></div>
    </section>
  </div>

  <template id="template-device">
    <label
      data-template-device-label
      class="device hy-nostyle"
    >
      <input
        data-template-device-input
        type="checkbox"
        name="device"
        class="hy-input-checkbox device__input"
      />
      <span class="device__tile">
        <span
          data-template-device-icon
          class="device__icon icon"
        ></span>
        <span class="device__checked"></span>
        <svg
          class="device__name-scale-wrapper"
          width="100%"
          height="100%"
          viewBox="0 0 92 92"
          preserveAspectRatio="xMinYMin meet"
        >
          <foreignObject
            width="100%"
            height="100%"
            x="0"
            y="0"
            xmlns="http://www.w3.org/1999/xhtml"
          >
            <div
              class="device__name-position-wrapper"
              xmlns="http://www.w3.org/1999/xhtml"
            >
              <span
                data-template-device-name
                class="device__name"
              ></span>
            </div>
          </foreignObject>
        </svg>
      </span>
    </label>
  </template>

  <script type="text/javascript">
    async function onHomeyReady(Homey) {
      const $content = document.getElementById('content');
      const $devicesContent = document.getElementById('devices-content');
      const $selectedCount = document.getElementById('selected-count');
      const $templateDevice = document.getElementById('template-device');

      try {
        const { PairingPanel } = await import('./pairing.mjs');
        const { SettingsTabs } = await import('./tabs.mjs');
        const state = await Homey.api('GET', '/state');
        const tabs = new SettingsTabs($content);
        tabs.initialize(state);
        const $pairing = document.getElementById('pairing-content');
        const pairingPanel = new PairingPanel({
          Homey,
          container: $pairing,
          onCommissionedChanged: () => { window.location.reload(); },
        });
        pairingPanel.update(state);
        pairingPanel.start();
        window.addEventListener('pagehide', () => { pairingPanel.dispose(); }, { once: true });

        if (state.commissioned === true) {
          // Get Devices
          const devices = await Homey.api('GET', '/devices');
          const updateSelectedCount = () => {
            const selected = devices.filter((device) => { return device.isSelected; }).length;
            $selectedCount.textContent = `${selected} selected`;
          };
          updateSelectedCount();

          async function updateDeviceSelection(device, input) {
            const selected = input.checked;
            input.disabled = true;
            try {
              const path = selected ? '/devices/enable' : '/devices/disable';
              await Homey.api('POST', path, { deviceId: device.id });
              device.isSelected = selected;
            } catch (error) {
              input.checked = device.isSelected;
              throw error;
            } finally {
              input.disabled = false;
              updateSelectedCount();
            }
          }

          // Create Zones
          const $zones = document.createElement('div');
          $zones.className = 'zones';
          $devicesContent.appendChild($zones);

          const $zone_devices_by_name = {};

          const zones = new Set();
          for (const device of devices) {
            if (!device.zoneName) continue;
            zones.add(device.zoneName);
          }

          const zonesArray = Array.from(zones);
          zonesArray.sort();
          for (const zone of zonesArray) {
            const $zone = document.createElement('div');
            $zone.className = 'zone';
            $zone.dataset.zoneName = zone;
            $zones.appendChild($zone);

            const $zoneName = document.createElement('h2');
            $zoneName.className = 'zone-name';
            $zoneName.textContent = zone;
            $zone.appendChild($zoneName);

            const $zoneDevices = document.createElement('div');
            $zoneDevices.className = 'zone-devices';
            $zone.appendChild($zoneDevices);

            $zone_devices_by_name[zone] = $zoneDevices;
          }

          // Add Devices to Zones
          for (const device of devices) {
            const $device = $templateDevice.content.cloneNode(true);

            const $label = $device.querySelector('[data-template-device-label]');
            const $input = $device.querySelector('[data-template-device-input]');
            const $name = $device.querySelector('[data-template-device-name]');
            const $icon = $device.querySelector('[data-template-device-icon]');

            $input.addEventListener('change', () => {
              updateDeviceSelection(device, $input).catch((error) => { Homey.error(error); });
            });

            $name.setAttribute('title', device.name);
            $name.textContent = device.name;

            if (device.iconOverride) {
              const iconUrl = `https://athombv.github.io/node-homey-lib/assets/device/icons/${device.iconOverride}.svg`;
              const image = new Image();
              image.src = iconUrl;
              image.onload = () => {
                $icon.style.maskImage = `url(${iconUrl})`;
              };
              image.onerror = () => {
                if (device.iconUrl) {
                  $icon.style.maskImage = `url(${device.iconUrl})`;
                } else {
                  $icon.classList.add('is-missing');
                }
              };
            } else if (device.iconUrl) {
              $icon.style.maskImage = `url(${device.iconUrl})`;
            } else {
              $icon.classList.add('is-missing');
            }

            if (device.isSelected) {
              $input.checked = 'checked';
            }

            $zone_devices_by_name[device.zoneName].appendChild($device);
          }
        }

        Homey.ready();
      } catch (err) {
        console.error(err);
        Homey.error(err);
      }
    }
  </script>

</body>

</html>
